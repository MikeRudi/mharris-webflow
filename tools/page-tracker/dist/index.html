<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Michael's Webdev Tracker</title><link rel="stylesheet" href="/styles.css"><script type="module" src="/app.js"></script></head>
<body>
<main>
  <header><div class="heading-row"><div class="heading-title"><h1 id="project-title">Page tracker</h1></div><div class="header-actions"><button id="open-todos">To-do list</button><button id="open-typography">Typography</button><button id="new-page" class="primary">+ Add page</button></div></div></header>
  <div class="save-status-row"><span id="save-status" role="status" aria-live="polite">Loading…</span></div>
  <div id="page-list"></div><div id="empty" hidden>No pages yet.</div>
  <footer>“Dev Desktop”, “Dev Mobile” and “Complete” are checked only after Michael’s final approval.</footer>
</main>
<dialog id="detail"><form id="detail-form"><div class="dialog-top"><div class="eyebrow">PAGE DETAILS</div><button type="button" class="close" id="close-detail" aria-label="Close page details">×</button></div><h2 id="detail-title"></h2><div id="detail-links" class="detail-links"></div><label>Page name<input name="name" required></label><div class="form-grid"><label>Group<input name="group" list="group-options" required><datalist id="group-options"></datalist></label><label>Type<select name="kind"><option value="page">Page</option><option value="component">Component / shared UI</option><option value="reference">Reference / alternate design</option><option value="template">Template</option><option value="collection">CMS collection</option></select></label></div><fieldset id="detail-checks" class="detail-checks"></fieldset><label>Figma frame name<input name="figmaFrame"></label><label>Content / sections<textarea name="content" rows="7" placeholder="One section or observation per line"></textarea></label><label>Next steps / your notes<textarea name="notes" rows="4"></textarea></label><details><summary>Reference details</summary><div id="evidence"></div><label>Figma link<input name="figmaUrl" type="url"></label><label>Webflow staging link<input name="webflowUrl" type="url"></label></details><div class="dialog-actions"><button type="button" id="cancel-detail">Cancel</button><button type="submit" class="primary">Save changes</button></div><p class="form-error" id="form-error" role="alert"></p></form></dialog>
<dialog id="todo-dialog" aria-labelledby="todo-title">
  <div class="dialog-top"><h2 id="todo-title">To-do list</h2><button type="button" class="close" id="close-todos" aria-label="Close to-do list">×</button></div>
  <form id="todo-add-form"><input id="todo-new-title" aria-label="New to-do item" placeholder="Add a to-do item…" required maxlength="500"><button type="submit" class="primary">Add item</button></form>
  <div id="todo-list"></div><p id="todo-empty" class="muted" hidden>No to-do items yet.</p>
  <div id="todo-save-status" class="todo-save-status" role="status" aria-live="polite"></div>
</dialog>
<dialog id="typography-dialog" aria-labelledby="typography-title">
  <div class="dialog-top"><h2 id="typography-title">Typography</h2><button type="button" class="close" id="close-typography" aria-label="Close typography">×</button></div>
  <div id="typography-content"></div>
</dialog>
</body></html>
