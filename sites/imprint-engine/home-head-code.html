<style id="home-animation-initial-state">
  /* Match homeAnimation() before the asynchronous site code arrives. */
  @media screen and (min-width: 992px) {
    [home-resting],
    [home-start-up],
    [home-second-up],
    [home-third-up],
    [home-logo-up],
    [home-gradient-piece],
    [home-gradient-drop],
    [home-gradient-line],
    [home-drop-purple-base],
    [home-drop-colors],
    [home-drop-star],
    [ripple-ring],
    [home-end-ripple],
    [layout-end] > :not([home-end-brackets]),
    [layout-end] [home-end-brackets-svg] {
      opacity: 0;
    }
  }
</style>

<style id="home-nav-initial-state">
  /* The hero nav always uses light text; the page nav keeps its scroll themes. */
  [home-start] [nav-block] {
    color: #fff;
    background-color: #8989890a;
    border-color: #ffffff3d;
    column-gap: normal;
    row-gap: normal;
  }

  /* Keep the hero nav above the page nav before the async stylesheet loads. */
  [layout-start]:has([home-start] [nav-block]) {
    z-index: auto;
  }

  [home-start] > :has(> [nav-block]) {
    position: absolute;
  }
</style>
